<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Terminated</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f0f0f,#1a1a1a,#111);
      overflow:hidden;
      color:white;
    }

    .container{
      width:90%;
      max-width:500px;
      padding:40px 30px;
      border-radius:20px;
      text-align:center;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 25px rgba(0,0,0,0.5);
      animation:fadeIn 1.5s ease;
    }

    h1{
      color:#ff4d4d;
      margin-bottom:20px;
      font-size:32px;
      text-transform:uppercase;
      letter-spacing:2px;
    }

    p{
      font-size:17px;
      line-height:1.7;
      color:#ddd;
      margin-bottom:30px;
    }

    .whatsapp-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      background:#25D366;
      color:white;
      padding:14px 28px;
      border-radius:50px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 0 15px rgba(37,211,102,0.5);
    }

    .whatsapp-btn:hover{
      transform:scale(1.08);
      box-shadow:0 0 25px rgba(37,211,102,0.9);
    }

    .pulse{
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
      100%{
        transform:scale(1);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .glow{
      position:absolute;
      width:300px;
      height:300px;
      background:#ff0000;
      filter:blur(120px);
      opacity:0.15;
      animation:moveGlow 8s infinite alternate;
    }

    @keyframes moveGlow{
      from{
        transform:translate(-150px,-100px);
      }
      to{
        transform:translate(150px,100px);
      }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="container pulse">
    <h1>Service Terminated</h1>

    <p>
      This service has been terminated due to no response and insufficient information provided by the company team.<br><br>
      To restart the website service, please contact me on WhatsApp.
    </p>

    <a 
      class="whatsapp-btn"
      href="https://wa.me/923299931199?text=Hello%20I%20want%20to%20restart%20the%20website%20service"
      target="_blank"
    >
      Contact on WhatsApp
    </a>
  </div>

  <script>
    // Simple title animation
    let dots = 0;

    setInterval(() => {
      dots = (dots + 1) % 4;
      document.title = "Service Terminated" + ".".repeat(dots);
    }, 500);
  </script>

</body>
</html>
